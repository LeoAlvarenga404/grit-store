name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: dotnet restore
      - run: dotnet build --no-restore
      - run: dotnet format --verify-no-changes --no-restore
      - run: dotnet test --no-build
      - run: npm ci
        working-directory: web
      - run: npm run gen:api
        working-directory: web
      - name: OpenAPI document and generated types are committed
        run: |
          git status --porcelain -- web/openapi web/lib/api
          test -z "$(git status --porcelain -- web/openapi web/lib/api)"
      - run: npm run lint
        working-directory: web
      - run: npm run build
        working-directory: web
